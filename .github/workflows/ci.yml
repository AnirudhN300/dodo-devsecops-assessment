name: Secure CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/anirudhn300/ledger-api

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # Checkout Repository
      # -------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------
      # Setup Python
      # -------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------
      # Install Semgrep
      # -------------------------------
      - name: Install Semgrep
        run: pip install semgrep

      # -------------------------------
      # Run Semgrep
      # -------------------------------
      - name: Run Semgrep
        run: semgrep --config=auto .

      # -------------------------------
      # Run Gitleaks
      # -------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      # -------------------------------
      # Trivy Filesystem Scan
      # -------------------------------
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0

      # -------------------------------
      # Login to GHCR
      # -------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------
      # Build Docker Image
      # -------------------------------
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} ./app
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest

      # -------------------------------
      # Trivy Image Scan
      # -------------------------------
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 0

      # -------------------------------
      # Push Images
      # -------------------------------
      - name: Push Docker Images
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      # -------------------------------
      # Install Cosign
      # -------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # -------------------------------
      # Sign Docker Image
      # -------------------------------
      - name: Sign Docker Image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
          chmod 600 cosign.key

          cosign sign \
            --key cosign.key \
            --yes \
            $IMAGE_NAME:${{ github.sha }}

      # -------------------------------
      # Get Image Digest
      # -------------------------------
      - name: Get Image Digest
        id: digest
        run: |
          DIGEST=$(docker inspect $IMAGE_NAME:${{ github.sha }} --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      # -------------------------------
      # Generate SLSA Provenance
      # -------------------------------
      - name: Generate SLSA Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # -------------------------------
      # Verify Cosign Signature
      # -------------------------------
      - name: Verify Signature
        run: |
          echo "${{ secrets.COSIGN_PUBLIC_KEY }}" > cosign.pub

          cosign verify \
            --key cosign.pub \
            $IMAGE_NAME:${{ github.sha }}

      # -------------------------------
      # Workflow Completed
      # -------------------------------
      - name: Success
        run: echo "Secure CI Pipeline completed successfully."
